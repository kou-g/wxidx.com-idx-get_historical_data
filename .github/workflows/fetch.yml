name: Fetch stock data and deploy to Xserver

on:
  schedule:
    # 毎時0分に実行（UTC基準。日本時間からは-9時間なので、JSTの毎時0分に実行したい場合は
    # サーバー処理が数分ずれても問題ない前提でこのままでOK。厳密にJST毎時0分にしたい場合は
    # 単純に "0 * * * *" のままで問題ありません。GitHub Actionsのcronはあくまで目安の時刻で、
    # 高負荷時は数分〜十数分遅延することがあります）
    - cron: '0 * * * *'
  workflow_dispatch: {}
    # 手動実行用。Actionsタブの「Run workflow」ボタンから、スケジュールを待たずに
    # 動作確認ができます。導入時はまずこちらで試すことを推奨します。

concurrency:
  group: fetch-stock-data
  cancel-in-progress: false
  # 前回の実行が万一長引いていても、多重実行はせず順番待ちにする

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --upgrade yfinance

      - name: Run data fetch script
        run: python get_historical_data.py

      - name: Verify stock_data.db was created
        run: |
          if [ ! -f stock_data.db ]; then
            echo "stock_data.db が生成されませんでした。get_historical_data.py 側でエラーが発生している可能性があります。"
            exit 1
          fi
          ls -lh stock_data.db

      - name: Set up SSH agent with key (passphrase対応)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.XSERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.XSERVER_PORT }}" "${{ secrets.XSERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          # パスフレーズを対話無しでssh-addに渡すためのaskpassスクリプト
          cat > /tmp/askpass.sh <<'EOS'
          #!/bin/sh
          echo "$SSH_KEY_PASSPHRASE"
          EOS
          chmod +x /tmp/askpass.sh

          export SSH_ASKPASS=/tmp/askpass.sh
          export SSH_ASKPASS_REQUIRE=force
          # 制御端末を切り離してaskpassを強制的に使わせる（setsidが無いとaskpassが無視されるため）
          setsid ssh-add ~/.ssh/id_ed25519 < /dev/null
        env:
          # パスフレーズ無しの鍵を使う場合は、このSecretを未登録のままでOK（空文字として扱われる）
          SSH_KEY_PASSPHRASE: ${{ secrets.XSERVER_SSH_PASSPHRASE }}

      - name: Upload stock_data.db via SFTP
        run: |
          sftp -P "${{ secrets.XSERVER_PORT }}" \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }}" <<EOF
          put stock_data.db ${{ secrets.XSERVER_REMOTE_PATH }}/stock_data.db
          bye
          EOF

      - name: Clean up SSH key and agent
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519
          [ -n "$SSH_AGENT_PID" ] && kill "$SSH_AGENT_PID" || true
