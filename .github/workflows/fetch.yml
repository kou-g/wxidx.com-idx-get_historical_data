name: Fetch stock data and deploy to Xserver

on:
  # 起動時刻設定（UTC）
  schedule:
    - cron: '41 21 * * *'
    - cron: '41 09 * * *'
  workflow_dispatch: {}
    # 手動実行用。Actionsタブの「Run workflow」ボタンから、スケジュールを待たずに
    # 動作確認ができます。開発中はこちらだけを使って動作確認してください。

concurrency:
  group: fetch-stock-data
  cancel-in-progress: false
  # 前回の実行が万一長引いていても、多重実行はせず順番待ちにする

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --upgrade yfinance

      - name: Run data fetch script
        run: python get_historical_data.py

      - name: Verify stock_data.db was created
        run: |
          if [ ! -f stock_data.db ]; then
            echo "stock_data.db が生成されませんでした。get_historical_data.py 側でエラーが発生している可能性があります。"
            exit 1
          fi
          ls -lh stock_data.db

      - name: Upload stock_data.db via FTPS
        run: |
          curl --ssl-reqd --user "${{ secrets.XSERVER_FTP_USER }}:${{ secrets.XSERVER_FTP_PASSWORD }}" \
            -T stock_data.db \
            "ftp://${{ secrets.XSERVER_FTP_HOST }}${{ secrets.XSERVER_REMOTE_PATH }}/pages/idx/stock_data.db"
